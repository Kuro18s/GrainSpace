# Chạy từ thư mục gốc repo:  docker compose -f devops/docker-compose.yml up --build
# Giả định cấu trúc repo: backend/  ai_service/  web/  mobile/  devops/  docs/
services:
  ai:
    build: { context: .., dockerfile: devops/ai.Dockerfile }
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      retries: 5
  backend:
    build: { context: .., dockerfile: devops/backend.Dockerfile }
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite:////data/phongtoi.db
      JWT_SECRET: ${JWT_SECRET:-doi-gia-tri-nay-khi-deploy}
      AI_SERVICE_URL: http://ai:8001
    volumes: ["dbdata:/data"]
    depends_on: [ai]
  web:
    build: { context: .., dockerfile: devops/web.Dockerfile, args: { VITE_API_URL: http://localhost:8000 } }
    ports: ["8080:80"]
    depends_on: [backend]
volumes:
  dbdata:
