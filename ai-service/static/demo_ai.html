<style>
:root{--bg:#eceeed;--sf:#fbfbfa;--ink:#17201e;--mut:#5d6a67;--ln:#d3d8d6;--ac:#b3261e;--acw:#fff;--ok:#1f7a4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 40px}h1{font-size:22px;margin:0}p.n{color:var(--mut);margin:4px 0 16px;font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.tabs button,.btn{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
.tabs button.on,.btn.p{background:var(--ac);color:var(--acw);border-color:var(--ac)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 14px;margin-top:10px}.card b{display:block}.m{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px}input,select{width:100%;padding:9px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--ink);font:inherit}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:8px 0}label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{font-size:13px;padding:3px 10px;border:1px dashed var(--ln);border-radius:99px;background:none;color:var(--mut);cursor:pointer}
.bar{height:5px;background:var(--ln);border-radius:3px;margin-top:6px}.bar i{display:block;height:5px;background:var(--ac);border-radius:3px}
.tag{font-size:12px;border:1px solid var(--ln);border-radius:99px;padding:1px 8px;margin:4px 4px 0 0;display:inline-block}.ok{color:var(--ok)}
.log{display:flex;flex-direction:column;gap:8px;margin:10px 0}.b{padding:9px 12px;border-radius:12px;max-width:88%;white-space:pre-wrap}.u{align-self:flex-end;background:var(--ac);color:var(--acw)}.a{background:var(--sf);border:1px solid var(--ln)}
</style></head><body><main>
<h1>Demo FilmLab AI</h1><p class="n">Prototype chạy ngay trong trình duyệt, dùng dữ liệu mẫu 23 không gian (gồm 3 không gian của app FilmLab) và 29 câu hỏi đáp. Cùng thuật toán với file ai_service.py.</p>

<script>
const D={"spaces": [{"id": 1, "name": "Phòng tối Hẻm Sáng", "type": "Phòng tối", "district": "Quận 3", "area": 18, "cap": 4, "price": 120000, "style": "in ảnh đen trắng", "equipment": ["Máy phóng Durst M805", "Khay hóa chất", "Đèn an toàn đỏ"], "desc": "Phòng tối yên tĩnh trong hẻm nhỏ, chuyên in phóng ảnh đen trắng, thông gió tốt, có nước sạch và bàn sấy ảnh.", "city": "TP. Hồ Chí Minh"}, {"id": 2, "name": "Studio Hạt Bạc", "type": "Studio", "district": "Quận 1", "area": 45, "cap": 8, "price": 250000, "style": "chân dung", "equipment": ["Đèn Godox 300W", "Phông nền xám", "Softbox"], "desc": "Studio rộng ánh sáng nhân tạo, phù hợp chụp chân dung phim, có phông nền và bộ đèn flash.", "city": "TP. Hồ Chí Minh"}, {"id": 3, "name": "Phòng tối Muối Bạc", "type": "Phòng tối", "district": "Quận 10", "area": 12, "cap": 2, "price": 90000, "style": "tráng phim màu", "equipment": ["Hóa chất C-41", "Tank tráng phim", "Máy quét Plustek"], "desc": "Phòng nhỏ cho tráng phim màu C-41 tại chỗ, phù hợp người mới bắt đầu, có hướng dẫn từng bước.", "city": "TP. Hồ Chí Minh"}, {"id": 4, "name": "Xưởng Ánh Sáng Tự Nhiên", "type": "Studio", "district": "Quận 2", "area": 60, "cap": 10, "price": 300000, "style": "ánh sáng tự nhiên", "equipment": ["Tấm hắt sáng", "Phông vải", "Tripod"], "desc": "Studio có cửa sổ lớn đón nắng, chụp ánh sáng tự nhiên, hợp ảnh thời trang và lookbook phong cách hoài cổ.", "city": "TP. Hồ Chí Minh"}, {"id": 5, "name": "Lab Phim Bình Thạnh", "type": "Phòng tối", "district": "Bình Thạnh", "area": 20, "cap": 5, "price": 150000, "style": "tráng phim đen trắng và in phóng", "equipment": ["Máy phóng Beseler", "Tank tráng phim", "Máy sấy phim"], "desc": "Lab đầy đủ thiết bị tráng phim đen trắng và in phóng, có nhân viên hỗ trợ kỹ thuật, nhận tổ chức workshop nhỏ.", "city": "TP. Hồ Chí Minh"}, {"id": 6, "name": "Studio Sản Phẩm Mộc", "type": "Studio", "district": "Quận 7", "area": 30, "cap": 4, "price": 220000, "style": "chụp sản phẩm", "equipment": ["Bàn chụp sản phẩm", "Đèn LED", "Phông trắng vô cực"], "desc": "Studio chuyên chụp sản phẩm nhỏ như mỹ phẩm, đồ handmade, có bàn chụp và phông trắng liền mạch.", "city": "TP. Hồ Chí Minh"}, {"id": 7, "name": "Phòng tối Kỷ Niệm", "type": "Phòng tối", "district": "Quận 5", "area": 15, "cap": 3, "price": 100000, "style": "in ảnh thủ công", "equipment": ["Máy phóng Meopta", "Giấy ảnh baryta", "Khay hóa chất"], "desc": "Phòng tối phong cách cổ điển, in ảnh thủ công trên giấy baryta, hợp người thích kỹ thuật in truyền thống.", "city": "TP. Hồ Chí Minh"}, {"id": 8, "name": "Studio Phim Màu Sài Gòn", "type": "Studio", "district": "Quận 1", "area": 40, "cap": 6, "price": 280000, "style": "phim màu hoài cổ", "equipment": ["Đèn tungsten", "Phông họa tiết", "Đạo cụ vintage"], "desc": "Studio bày trí đồ vintage, ánh sáng tungsten ấm, phù hợp chụp phim màu phong cách thập niên 90.", "city": "TP. Hồ Chí Minh"}, {"id": 9, "name": "Phòng tối Cộng Đồng Tân Bình", "type": "Phòng tối", "district": "Tân Bình", "area": 25, "cap": 8, "price": 80000, "style": "học tập và workshop", "equipment": ["3 máy phóng", "Khay hóa chất", "Bàn sấy"], "desc": "Phòng tối rộng giá rẻ cho nhóm học viên, thường dùng cho workshop và lớp học nhiếp ảnh phim cơ bản.", "city": "TP. Hồ Chí Minh"}, {"id": 10, "name": "Scan Lab Phú Nhuận", "type": "Phòng tối", "district": "Phú Nhuận", "area": 10, "cap": 2, "price": 70000, "style": "quét và số hóa phim", "equipment": ["Máy quét Epson V850", "Máy quét Plustek 8200i", "Máy tính hiệu chỉnh màu"], "desc": "Phòng chuyên quét phim âm bản và số hóa ảnh cũ độ phân giải cao, có máy tính hiệu chỉnh màu.", "city": "TP. Hồ Chí Minh"}, {"id": 11, "name": "Studio Gia Đình Nhỏ", "type": "Studio", "district": "Quận 3", "area": 35, "cap": 8, "price": 200000, "style": "chụp gia đình", "equipment": ["Đèn softbox", "Ghế sofa", "Phông nền be"], "desc": "Studio ấm cúng cho chụp ảnh gia đình, nhóm bạn, sức chứa lớn, có ghế sofa và góc trang điểm.", "city": "TP. Hồ Chí Minh"}, {"id": 12, "name": "Phòng tối Đêm Đỏ", "type": "Phòng tối", "district": "Quận 4", "area": 14, "cap": 3, "price": 110000, "style": "in ảnh nghệ thuật thử nghiệm", "equipment": ["Máy phóng Durst", "Đèn an toàn", "Hóa chất tone màu"], "desc": "Phòng tối cho dự án nghệ thuật, thử nghiệm kỹ thuật in sáng tạo như tone màu, in chồng ảnh, solarization.", "city": "TP. Hồ Chí Minh"}, {"id": 13, "name": "Studio Mini Thủ Đức", "type": "Studio", "district": "Thủ Đức", "area": 20, "cap": 3, "price": 150000, "style": "chân dung cá nhân", "equipment": ["Đèn Godox", "Phông nền trơn", "Tripod"], "desc": "Studio nhỏ giá mềm cho chụp chân dung cá nhân, ảnh thẻ nghệ thuật, sinh viên hay thuê.", "city": "TP. Hồ Chí Minh"}, {"id": 14, "name": "Lab Ảnh Nghệ Sĩ", "type": "Phòng tối", "district": "Quận 1", "area": 22, "cap": 4, "price": 200000, "style": "in ảnh cao cấp", "equipment": ["Máy phóng Durst M805", "Giấy ảnh fiber", "Máy sấy ép"], "desc": "Lab in ảnh đen trắng chất lượng triển lãm, giấy fiber cao cấp, hợp nghệ sĩ chuẩn bị bộ ảnh trưng bày.", "city": "TP. Hồ Chí Minh"}, {"id": 15, "name": "Studio Phố Cổ", "type": "Studio", "district": "Quận 5", "area": 50, "cap": 10, "price": 260000, "style": "đường phố và kiến trúc", "equipment": ["Phông gạch", "Đèn nền", "Tripod"], "desc": "Studio dựng bối cảnh phố cổ gạch rêu, phù hợp chụp ảnh phong cách đường phố, kiến trúc cổ.", "city": "TP. Hồ Chí Minh"}, {"id": 16, "name": "Phòng tối Hóa Chất Xanh", "type": "Phòng tối", "district": "Gò Vấp", "area": 16, "cap": 3, "price": 95000, "style": "tráng phim thân thiện môi trường", "equipment": ["Hóa chất không độc hại", "Tank tráng phim", "Bình xử lý nước thải"], "desc": "Phòng tối dùng hóa chất ít độc, có xử lý nước thải, phù hợp người quan tâm an toàn và môi trường.", "city": "TP. Hồ Chí Minh"}, {"id": 17, "name": "Studio Thời Trang Lụa", "type": "Studio", "district": "Quận 2", "area": 70, "cap": 12, "price": 350000, "style": "thời trang", "equipment": ["Hệ đèn studio", "Quạt gió", "Giá treo trang phục"], "desc": "Studio lớn chụp thời trang, có giá treo trang phục, quạt tạo gió, phòng thay đồ riêng và trần cao.", "city": "TP. Hồ Chí Minh"}, {"id": 18, "name": "Phòng tối Sinh Viên", "type": "Phòng tối", "district": "Quận 10", "area": 12, "cap": 4, "price": 60000, "style": "học tập", "equipment": ["Máy phóng cơ bản", "Khay hóa chất"], "desc": "Phòng tối giá rẻ cho sinh viên mới học in ảnh, có người hướng dẫn buổi đầu, thiết bị cơ bản.", "city": "TP. Hồ Chí Minh"}, {"id": 19, "name": "Studio Bóng Tối Nghệ Thuật", "type": "Studio", "district": "Quận 3", "area": 28, "cap": 4, "price": 240000, "style": "ánh sáng tương phản thấp", "equipment": ["Đèn spotlight", "Phông đen", "Máy tạo khói"], "desc": "Studio phông đen, chụp ảnh tương phản mạnh kiểu low-key, kịch tính, có máy tạo khói.", "city": "TP. Hồ Chí Minh"}, {"id": 20, "name": "Lab Phục Chế Ảnh Xưa", "type": "Phòng tối", "district": "Quận 5", "area": 18, "cap": 3, "price": 130000, "style": "phục chế ảnh cũ", "equipment": ["Máy quét Epson V850", "Bàn làm sạch ảnh", "Hóa chất bảo quản"], "desc": "Phòng hỗ trợ phục chế ảnh cũ, làm sạch, quét độ phân giải cao và bảo quản ảnh giấy hoặc phim âm bản.", "city": "TP. Hồ Chí Minh"}, {"id": 21, "name": "Saigon Darkroom 36", "type": "Phòng tối", "district": "Quận 3", "city": "TP. Hồ Chí Minh", "area": 20, "cap": 4, "price": 180000, "style": "in ảnh và quét phim", "equipment": ["Máy scan Noritsu HS-1800", "Máy phóng Durst M670"], "rating": 4.9, "desc": "Phòng tối được yêu thích nhất tại Quận 3, đánh giá 4.9 trên 5, phù hợp cả người mới và người đã có kinh nghiệm, có máy phóng và máy scan film."}, {"id": 22, "name": "The Grain Studio", "type": "Studio", "district": "Quận 1", "city": "TP. Hồ Chí Minh", "area": 40, "cap": 6, "price": 350000, "style": "chân dung", "equipment": ["Đèn Godox AD600", "Phông nền"], "rating": 4.8, "desc": "Studio chụp chân dung ánh sáng linh hoạt, có phông nền và đèn Godox, thường còn lịch trống trong ngày."}, {"id": 23, "name": "Noir Film Lab", "type": "Phòng tối", "district": "Ba Đình", "city": "Hà Nội", "area": 25, "cap": 5, "price": 220000, "style": "in ảnh và quét phim", "equipment": ["Máy ảnh Mamiya RZ67"], "rating": 4.7, "desc": "Phòng tối tại Ba Đình, Hà Nội, phản hồi nhanh, có dịch vụ scan film."}], "kb": [["Tráng phim đen trắng gồm những bước nào?", "Các bước chính: developer, stop bath, fixer, rửa nước, tráng chất chống vệt rồi treo sấy. Nhiệt độ thường giữ khoảng 20 độ C và canh thời gian đúng theo loại phim và developer."], ["Tráng phim màu C-41 cần lưu ý gì?", "C-41 đòi hỏi nhiệt độ rất ổn định khoảng 38 độ C, gồm các bước developer màu, blix và rửa. Sai nhiệt độ dễ làm lệch màu, nên nên dùng bể ổn nhiệt."], ["Đèn an toàn trong phòng tối dùng màu gì?", "Giấy ảnh đen trắng thường dùng đèn an toàn màu đỏ hoặc cam. Phim thì phải xử lý trong bóng tối hoàn toàn, không dùng đèn an toàn."], ["Máy phóng ảnh (enlarger) dùng để làm gì?", "Máy phóng chiếu hình ảnh từ phim âm bản lên giấy ảnh để in phóng to. Có thể chỉnh độ cao, lấy nét và thời gian phơi sáng."], ["Làm sao chọn thời gian phơi khi in ảnh?", "Dùng test strip: phơi từng đoạn giấy với thời gian khác nhau rồi chọn đoạn có độ đen và chi tiết vùng sáng hợp lý nhất."], ["Phim ISO 400 khác ISO 100 thế nào?", "ISO 400 nhạy sáng hơn nên chụp trong điều kiện thiếu sáng tốt hơn nhưng hạt phim thô hơn. ISO 100 hạt mịn, cần nhiều ánh sáng hơn."], ["Nên chọn phim đen trắng nào cho người mới?", "Người mới thường bắt đầu với Ilford HP5 Plus 400 hoặc Kodak Tri-X 400 vì dễ tính, độ dung sai phơi sáng rộng."], ["Phim âm bản màu khác phim slide thế nào?", "Phim âm bản cho ra hình ngược màu và cần in hoặc quét, độ dung sai phơi sáng rộng. Phim slide cho ra hình dương bản trực tiếp nhưng khó phơi chính xác hơn."], ["Cách quét phim để có chất lượng tốt?", "Làm sạch phim, dùng độ phân giải 3200 đến 4000 dpi, quét ở chế độ 16-bit rồi chỉnh sửa sau. Tránh bật các bộ lọc tự động mạnh."], ["Làm sao bảo quản phim chưa chụp?", "Để nơi mát và khô, tốt nhất trong tủ lạnh nếu để lâu, ngăn tia X và nhiệt độ cao. Để phim về nhiệt độ phòng trước khi dùng."], ["Phim đã chụp nên giữ bao lâu trước khi tráng?", "Nên tráng sớm. Nếu phải đợi, giữ nơi mát và khô, phim để lâu có thể bị mờ hoặc lệch màu, nhất là khi nóng ẩm."], ["Hóa chất tráng phim có độc không và xử lý thế nào?", "Một số hóa chất gây kích ứng da và mắt. Cần đeo găng, kính, làm việc nơi thông gió, không đổ trực tiếp ra cống mà thu gom và xử lý đúng quy định."], ["Cách pha hóa chất developer đúng cách?", "Pha đúng tỷ lệ nhà sản xuất, dùng nước sạch ở nhiệt độ quy định, khuấy đều và ghi ngày pha. Developer pha loãng thường dùng một lần."], ["Stop bath dùng để làm gì?", "Stop bath là dung dịch axit nhẹ dừng phản ứng của developer ngay lập tức, bảo vệ fixer và giúp kết quả đồng đều. Có thể thay bằng nước rửa nếu cần."], ["Fixer làm gì và cố định trong bao lâu?", "Fixer hòa tan bạc halogen chưa phơi sáng để ảnh không nhạy sáng nữa. Thời gian thường từ 3 đến 8 phút tùy loại phim và nồng độ."], ["Giấy ảnh RC và giấy fiber khác nhau thế nào?", "Giấy RC phủ nhựa, xử lý và sấy nhanh. Giấy fiber thấm nước, rửa lâu hơn nhưng bền và đẹp hơn, thường dùng cho in triển lãm."], ["Dodge và burn là gì?", "Dodge là che bớt ánh sáng để vùng đó sáng hơn, burn là cho thêm sáng để vùng đó tối hơn khi in phóng, giúp cân bằng độ tương phản cục bộ."], ["Máy ảnh phim cơ cho người mới nên chọn gì?", "Các máy SLR cơ như Pentax K1000, Canon AE-1 hay Nikon FM2 bền, dễ sửa và có nhiều ống kính, hợp người mới học."], ["Cách đo sáng khi chụp phim?", "Dùng máy đo sáng trong máy hoặc ứng dụng đo sáng. Với phim âm bản nên ưu tiên đo vùng tối và thà dư sáng hơn thiếu sáng."], ["Push và pull phim nghĩa là gì?", "Push là phơi thiếu rồi tráng lâu hơn để tăng độ nhạy, pull là phơi dư và tráng ngắn hơn. Cả hai ảnh hưởng đến độ tương phản và hạt."], ["Ảnh phim bị xước hoặc bụi, xử lý sao?", "Giữ phim sạch, dùng quạt thổi và vải không xơ. Khi quét có thể dùng chế độ loại bụi, hoặc làm sạch thủ công bằng phần mềm chỉnh ảnh."], ["Có thể phục chế ảnh cũ bằng cách nào?", "Quét độ phân giải cao, sau đó loại bỏ vết xước, vết ố và phục hồi độ tương phản. Có thể dùng công cụ AI để hỗ trợ nhưng cần kiểm tra lại chi tiết."], ["Khi đặt phòng tối nên chuẩn bị gì?", "Mang phim hoặc tờ ảnh âm bản, giấy ảnh nếu cần, găng tay và tạp dề. Hỏi trước phòng có sẵn hóa chất và thiết bị nào để khỏi mang thừa."], ["Nên thuê phòng tối bao lâu cho lần đầu?", "Người mới nên thuê 3 đến 4 giờ để làm quen thiết bị và quy trình, có thể cần thêm thời gian cho thử test strip và rửa ảnh."], ["Chi phí in ảnh trong phòng tối gồm những khoản nào?", "Gồm giá thuê phòng theo giờ, thuê thiết bị, hóa chất và giấy ảnh tiêu hao. Một số nơi bán gói trọn bộ có giá tốt hơn thuê lẻ."], ["Studio chụp phim cần ánh sáng thế nào?", "Phim cần đủ sáng hơn máy số, nhất là phim ISO thấp. Đèn flash studio hoặc đèn liên tục cùng ánh sáng tự nhiên đều dùng được, nhớ đo sáng kỹ."], ["Chụp chân dung phim cần lưu ý gì?", "Đo sáng trên da, dùng đèn mềm như softbox để da mịn, và chụp dư vài tấm vì phim không xem lại được ngay."], ["Làm sao hủy hoặc đổi lịch đặt phòng?", "Mỗi nhà cung cấp có chính sách riêng, thường cho đổi hoặc hủy miễn phí trước một khoảng thời gian nhất định. Hãy xem phần chính sách trong trang chi tiết phòng."], ["Tham gia workshop nhiếp ảnh phim thế nào?", "Xem mục workshop trong cộng đồng, đăng ký theo lịch do chuyên gia hoặc nhà cung cấp đăng. Số lượng chỗ thường có hạn nên nên đặt sớm."]]},$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),money=n=>n.toLocaleString('vi-VN')+'đ';
const fold=s=>s.toLowerCase().replace(/đ/g,'d').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]+/g,' ');
function grams(t){const o=[];for(const x of fold(t).split(/\s+/).filter(Boolean)){const w=' '+x+' ';for(let n=2;n<=4;n++){let off=0;o.push(w.slice(0,n));while(off+n<w.length){off++;o.push(w.slice(off,off+n))}if(off==0)break}}return o}
const cnt=t=>{const m=new Map();grams(t).forEach(g=>m.set(g,(m.get(g)||0)+1));return m};
class Idx{constructor(docs){const tf=docs.map(cnt),df=new Map(),N=docs.length;tf.forEach(m=>m.forEach((_,g)=>df.set(g,(df.get(g)||0)+1)));this.idf=new Map();df.forEach((c,g)=>this.idf.set(g,Math.log((1+N)/(1+c))+1));this.M=tf.map(m=>this.vec(m))}
vec(m){const v=new Map();let s=0;m.forEach((c,g)=>{if(!this.idf.has(g))return;const w=(1+Math.log(c))*this.idf.get(g);v.set(g,w);s+=w*w});s=Math.sqrt(s)||1;v.forEach((w,g)=>v.set(g,w/s));return v}
sim(q){const v=this.vec(cnt(q));return this.M.map(d=>{let t=0;v.forEach((w,g)=>{const x=d.get(g);if(x)t+=w*x});return t})}}
const SP=D.spaces,sp=new Idx(SP.map(s=>[s.name,s.type,s.district,s.style,s.equipment.join(' '),s.desc].join(' '))),kb=new Idx(D.kb.map(x=>x[0]+' '+x[1])),TH=0.32;
const QW=new Set(['gi','nao','sao','cach','khac','nen','bao']),PW=new Set(['re','gia','tiet','kiem']);
function assist(q){const kbs=kb.sim(q),sps=sp.sim(q),i=kbs.indexOf(Math.max(...kbs)),j=sps.indexOf(Math.max(...sps)),t=fold(q).split(/\s+/).filter(Boolean),K=()=>({t:D.kb[i][1],s:D.kb[i][0],k:kbs[i].toFixed(2)});
 if(t.some(x=>QW.has(x))&&kbs[i]>=TH)return K();
 if(sps[j]>=0.3){const o=sps.map((v,x)=>[v,x]).sort((a,b)=>b[0]-a[0]).slice(0,5).map(x=>x[1]);if(t.some(x=>PW.has(x)))o.sort((a,b)=>SP[a].price-SP[b].price);const s=SP[o[0]];return{t:'Mình gợi ý '+s.name+' ('+s.type+', '+s.district+', '+s.city+'), giá '+money(s.price)+'/giờ. '+s.desc,k:sps[j].toFixed(2)}}
 if(kbs[i]>=TH)return K();return{t:'Mình chưa có thông tin phù hợp. Bạn thử mô tả loại phòng, khu vực hoặc ngân sách nhé.',k:Math.max(kbs[i],sps[j]).toFixed(2)}}
const card=(s,sc,extra)=>'<div class="card"><b>'+esc(s.name)+'</b><span class="m">'+s.type+' · '+s.district+', '+s.city+' · '+s.area+' m² · tối đa '+s.cap+' người · '+money(s.price)+'/giờ</span><div class="m">'+esc(s.style)+'</div>'+(extra||'')+'<div class="bar"><i style="width:'+Math.min(100,sc*100)+'%"></i></div><div class="m">Điểm tương đồng: '+sc.toFixed(2)+'</div></div>';
const chips=a=>'<div class="chips">'+a.map(x=>'<button class="chip" data-q="'+esc(x)+'">'+esc(x)+'</button>').join('')+'</div>';
const TABS=[['s','Tìm phòng'],['r','Gợi ý phòng'],['c','Chatbot']];let tab='s',chat=[];
function view(){$('#tabs').innerHTML=TABS.map(t=>'<button data-t="'+t[0]+'" class="'+(t[0]==tab?'on':'')+'">'+t[1]+'</button>').join('');
 if(tab=='s')$('#v').innerHTML='<div class="row"><input id="q" placeholder="Mô tả phòng bạn cần, có thể gõ không dấu"><button class="btn p" id="go">Tìm</button></div>'+chips(['phòng tối giá rẻ cho người mới học','phong toi in anh den trang','chụp ảnh đường phố bối cảnh cổ','quét lại phim âm bản'])+'<div id="o"></div>';
 if(tab=='r')$('#v').innerHTML='<label>Nhu cầu</label><input id="q" placeholder="Ví dụ: tráng phim màu cho người mới"><div class="g"><div><label>Ngân sách tối đa (đ/giờ)</label><input id="bu" type="number" min="0" placeholder="Không giới hạn"></div><div><label>Số người</label><input id="pe" type="number" min="1" placeholder="Bất kỳ"></div><div><label>Loại phòng</label><select id="ty"><option value="">Tất cả</option><option>Phòng tối</option><option>Studio</option></select></div><div><label>Khu vực ưu tiên</label><select id="di"><option value="">Bất kỳ</option>'+[...new Set(SP.map(s=>s.district))].sort().map(d=>'<option>'+d+'</option>').join('')+'</select></div></div><button class="btn p" id="go">Gợi ý</button>'+chips(['tráng phim màu cho người mới','in ảnh đen trắng cho triển lãm','chụp chân dung phim'])+'<div id="o"></div>';
 if(tab=='c')$('#v').innerHTML='<div class="log" id="lg"></div><div class="row"><input id="q" placeholder="Hỏi về nhiếp ảnh phim..."><button class="btn p" id="go">Gửi</button></div>'+chips(['Phòng tối giá tốt','Studio chân dung','Không gian Hà Nội','phim màu tráng ở nhiệt độ bao nhiêu','giá bitcoin hôm nay']),drawChat()}
function drawChat(){const l=$('#lg');if(l)l.innerHTML=chat.map(m=>'<div class="b '+(m.u?'u':'a')+'">'+esc(m.t)+(m.s?'<div class="m">Nguồn: '+esc(m.s)+' · điểm '+m.k+'</div>':'')+'</div>').join('')}
function run(){const q=$('#q').value.trim(),o=$('#o');
 if(tab=='s'){const sc=sp.sim(q);o.innerHTML=!q?'':sc.map((v,i)=>[v,i]).sort((a,b)=>b[0]-a[0]).slice(0,5).map(x=>card(SP[x[1]],x[0])).join('')}
 if(tab=='r'){const bu=+$('#bu').value||0,pe=+$('#pe').value||0,ty=$('#ty').value,di=$('#di').value,sc=sp.sim(q);
  const r=SP.map((s,i)=>({s,sc:sc[i]+(di&&s.district==di?.15:0),i})).filter(x=>(!ty||x.s.type==ty)&&(!pe||x.s.cap>=pe)&&(!bu||x.s.price<=bu)).sort((a,b)=>b.sc-a.sc).slice(0,3);
  o.innerHTML=r.length?r.map(x=>{const w=[];if(sc[x.i]>.15)w.push('phù hợp nhu cầu ('+x.s.style+')');if(di&&x.s.district==di)w.push('cùng khu vực '+di);if(bu)w.push('trong ngân sách');return card(x.s,x.sc,'<div>'+x.s.equipment.map(e=>'<span class="tag">'+esc(e)+'</span>').join('')+'</div><div class="m ok">Lý do: '+(w.join(', ')||'khớp các bộ lọc')+'</div>')}).join(''):'<div class="card m">Không có phòng nào thỏa các điều kiện. Thử nới ngân sách hoặc số người.</div>'}
 if(tab=='c'&&q){chat.push({u:1,t:q});chat.push(assist(q));$('#q').value='';drawChat()}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t]'),c=e.target.closest('[data-q]');if(t){tab=t.dataset.t;view()}else if(c){$('#q').value=c.dataset.q;run()}else if(e.target.id=='go')run()});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='q')run()});view();
</script></body></html>
